name: agent-ready-skills
one_liner: Twenty practical AI-agent skills for turning messy work into clear specs, evals, reviews, briefs, and launch-ready artifacts.
target_user: Developers, PMs, AI-agent builders, and operators who need reusable agent workflows.
pain_point: Agent builders repeatedly rewrite the same review, planning, evaluation, debugging, and launch workflows instead of reusing clear skill instructions.
demo_command: python3 scripts/validate_skills.py .
topics:
  - ai-agents
  - skills
  - codex
  - claude-skills
  - prompt-engineering
  - llmops
  - developer-tools
release_channel:
  - github
  - public
launch_copy:
  - Twenty practical AI-agent skills for specs, evals, reviews, handoffs, risk audits, and launch readiness.
  - Copy one folder, read one SKILL.md, and adapt it to your agent workflow.
quality_gate:
  commands:
    - python3 scripts/validate_skills.py .
metrics_goal:
  first_week:
    - GitHub clones
    - Stars from relevant agent builders
    - Issues with concrete workflow examples
